<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아르스킨 대시보드</title>
<meta name="theme-color" content="#f2f4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아르스킨">
<link rel="icon" type="image/png" href="assets/arskin-icon.png?v=2">
<link rel="apple-touch-icon" href="assets/arskin-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles.css?v=202611131712">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand" role="button" tabindex="0" title="홈으로" id="brandHome"><img src="assets/arskin-icon.png" class="brand-logo" alt="Arskin" width="180" height="58"><small>아르스킨 대시보드</small></div>
    <nav class="nav">
      <button data-view="calendar"><svg class="nav-ic" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>콘텐츠 스튜디오</button>
      <div class="subnav content-subnav" aria-label="콘텐츠 스튜디오 메뉴">
        <button data-content-view="cal" class="active" aria-pressed="true">캘린더</button>
        <button data-content-view="ana" aria-pressed="false" disabled>분석</button>
        <button data-content-view="plan" aria-pressed="false" disabled>영상 기획</button>
      </div>
      <button data-view="daily"><svg class="nav-ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3h8l3 3v11H6z" /><path d="M9 9h5M9 12h5M9 15h3"/></svg>일간보고서</button>
      <div class="subnav" id="subnav"></div>
      <button data-view="director"><svg class="nav-ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="3.2"/><path d="M4 17c.6-3.2 3-5 6-5s5.4 1.8 6 5"/></svg>원장님 워크시트<span class="nav-badge hidden" aria-live="polite"></span></button>
      <div class="subnav dir-subnav" hidden><button data-dir="list">숙제 목록</button><button data-dir="sheet">원장님 워크시트</button></div>
      <button data-view="team"><svg class="nav-ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="7" cy="8" r="2.8"/><circle cx="14" cy="9" r="2.3"/><path d="M2 17c0-3 2.3-5 5-5s5 2 5 5M12.5 16c.3-2 1.5-3.3 3.3-3.3S18 14 18 16"/></svg>마케팅 공용</button>
      <div class="subnav team-subnav"><button data-team="check">업무 체크</button><button data-team="tags">태그 관리</button><button data-team="leaves">연월차</button></div>
      <button data-view="revenue"><svg class="nav-ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17h14"/><path d="M5 14V9M9 14V5M13 14v-3M17 14V7"/></svg>월간 매출표</button>
    </nav>
    <div class="sidefoot"><a id="jandiLink" class="jandi-link" target="_blank" rel="noopener"><i class="jandi-dot" aria-hidden="true"></i>잔디 열기 ↗</a><div class="sidefoot-row"><button type="button" id="navEdit" class="nav-edit" aria-pressed="false">메뉴 순서 편집</button><button type="button" data-view="settings" class="gear" title="설정 (관리자)" aria-label="설정" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg></button></div></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="datestrip" id="datestrip"></div>
      <div class="actions">
        <button id="btnPrint" title="인쇄 (Ctrl+P)" aria-label="인쇄"><i data-icon="print"></i>인쇄</button>
        <button id="toolToggle" class="icon-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="toolMenu" title="도구">☰</button>
        <div class="tool-menu" id="toolMenu" role="menu" hidden>
          <button id="btnDoneSort" role="menuitemcheckbox" aria-pressed="true"><i data-icon="sinkdone"></i><span>진행 중 위 · 완료 아래로 정렬</span></button>
          <button id="btnCollapse" role="menuitemcheckbox" aria-pressed="false"><i data-icon="hide"></i><span>완료 업무 접기</span></button>
          <button id="btnCarry" role="menuitem" title="직전 근무일의 이어갈 항목을 이 날짜로 복사"><i data-icon="carry"></i><span>전일 가져오기</span></button>
          <button id="btnReload" role="menuitem"><i data-icon="reload"></i><span>새로고침</span></button>
          <button id="btnTrash" role="menuitem"><i data-icon="trash"></i><span>휴지통 (14일 보관)</span></button>
          <a id="sheetLink" class="tool-quiet" role="menuitem" target="_blank" rel="noopener"><span>원본 Google 시트 열기 ↗</span></a>
          <button id="btnKeys" role="menuitem"><b class="kq">?</b><span>단축키</span></button>
        </div>
      </div>
    </header>

    <section id="viewDaily" class="view hidden">
      <div class="people mobile-only" id="peopleM"></div>
      <div class="seg mobile-only">
        <button data-pane="report" class="active">보고서</button>
        <button data-pane="timeline">타임라인</button>
      </div>
      <div class="daily">
        <div class="report-col">
          <section class="sharedcal" id="sharedcal"></section>
          <section class="sec" id="sharedtasks"></section>
          <article class="report" id="report"></article>
          <div class="card-edit-bar"><button type="button" id="cardEdit" aria-pressed="false">카드 배치 편집</button><button type="button" id="widthEdit" aria-pressed="false" aria-controls="widthBox">본문 폭 조절</button><div id="widthBox" class="width-box" hidden><label for="mainW">본문 폭 <b id="mainWv"></b></label><input type="range" id="mainW" min="560" max="1240" step="20"><button type="button" id="mainWreset">기본값</button></div></div>
        </div>
        <div class="side-col"><aside class="timeline" id="timeline"></aside><article class="done-page" id="donePage" aria-label="완료 업무 모아보기"></article></div>
      </div>
    </section>

    <section id="viewCalendar" class="view">
      <nav class="content-mobile-nav mobile-only" aria-label="콘텐츠 스튜디오 메뉴">
        <button data-content-view="cal" class="active" aria-pressed="true">캘린더</button>
        <button data-content-view="ana" aria-pressed="false" disabled>분석</button>
        <button data-content-view="plan" aria-pressed="false" disabled>영상 기획</button>
      </nav><div id="contentHub"></div></section>
    <section id="viewDirector" class="view hidden"><div id="directorHub" class="dir"></div></section>
    <section id="viewHome" class="view hidden"><div id="homeHub" class="home"></div></section>
    <section id="viewTeam" class="view hidden"><div id="teamHub" class="team"></div></section>
    <section id="viewSettings" class="view hidden"><div id="settingsHub" class="team"></div></section>
    <section id="viewRevenue" class="view hidden"><div id="revenueHub"></div></section>
  </main>

  <nav class="bottomnav mobile-only">
    <button data-view="home"><svg class="nav-ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9l7-6 7 6v8H3z"/><path d="M8 17v-5h4v5"/></svg>홈</button>
    <button data-view="calendar"><svg class="nav-ic" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>콘텐츠</button>
    <button data-view="daily" aria-label="일간보고서"><svg class="nav-ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3h8l3 3v11H6z"/><path d="M9 9h5M9 12h5M9 15h3"/></svg>보고서</button>
    <button data-view="director" aria-label="원장님 워크시트"><svg class="nav-ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="7" r="3.2"/><path d="M4 17c.6-3.2 3-5 6-5s5.4 1.8 6 5"/></svg>원장님<span class="nav-badge hidden"></span></button>
    <button data-view="revenue" aria-label="월간 매출표"><svg class="nav-ic" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17h14"/><path d="M5 14V9M9 14V5M13 14v-3M17 14V7"/></svg>매출</button>
  </nav>
</div>

<div id="blockEditor" class="popover hidden">
  <input id="beTitle" placeholder="무슨 일?">
  <div class="be-times"><input id="beStart" class="be-time" inputmode="numeric" placeholder="09:00" maxlength="5" aria-label="시작 시각 (예: 0930, 14)" autocomplete="off"> ~ <input id="beEnd" class="be-time" inputmode="numeric" placeholder="10:00" maxlength="5" aria-label="종료 시각 (예: 1030, 15)" autocomplete="off"><small class="be-hint">24시 · 0930, 14 처럼 입력</small></div>
  <div class="be-color swatches" id="beColorWrap" role="radiogroup" aria-label="블록 색" hidden></div>
  <label class="be-ext" id="beExtWrap"><input type="checkbox" id="beExt"> 외부 인원 미팅 <small>대시보드에 남은 시간이 표시됩니다</small></label>
  <label class="be-repeat" id="beRepeatWrap">반복 <select id="beRepeat"><option value="">안 함</option><option value="w">매주</option><option value="2w">격주</option><option value="m">매월</option></select><small>완료 체크하면 다음 일정이 자동으로 생깁니다</small></label>
  <div class="be-copy" id="beCopyWrap"><input id="beCopyDate" type="date" aria-label="복제할 날짜"><select id="beCopyTo" aria-label="복제할 캘린더"><option value="공통">마케팅 공용</option><option value="원장님">원장님 캘린더</option><option value="me">내 타임라인</option></select><button id="beCopy" type="button">복제</button></div>
  <div class="be-actions"><button id="beDelete" class="danger">삭제</button><button id="beCancel">취소</button><button id="beSave" class="primary">저장</button></div>
</div>
<div id="appToast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="config.js?v=202611131712"></script>
<script src="content-hub.js?v=202611131712"></script>
<script src="revenue-model.js?v=202611131712"></script>
<script src="revenue-hub.js?v=202611131712"></script>
<script src="app.js?v=202611131712"></script>
</body>
</html>
