<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아르스킨 대시보드</title>
<meta name="theme-color" content="#f2f4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아르스킨">
<link rel="icon" type="image/png" href="assets/arskin-icon.png?v=2">
<link rel="apple-touch-icon" href="assets/arskin-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand" role="button" tabindex="0" title="홈으로" id="brandHome"><img src="assets/arskin-icon.png" class="brand-logo" alt="Arskin" width="180" height="58"><small>아르스킨 대시보드</small></div>
    <nav class="nav">
      <button data-view="calendar">콘텐츠 스튜디오</button>
      <div class="subnav content-subnav" aria-label="콘텐츠 스튜디오 메뉴">
        <button data-content-view="cal" class="active" aria-pressed="true">캘린더</button>
        <button data-content-view="ana" aria-pressed="false" disabled>분석</button>
        <button data-content-view="plan" aria-pressed="false" disabled>영상 기획</button>
      </div>
      <button data-view="daily">일간보고서</button>
      <div class="subnav" id="subnav"></div>
      <button data-view="director">원장님 숙제<span class="nav-badge hidden" aria-live="polite"></span></button>
      <div class="subnav dir-subnav"><button data-dir="list">숙제 목록</button><button data-dir="sheet">원장님 워크시트</button></div>
      <button data-view="team">마케팅 공용</button>
      <div class="subnav team-subnav"><button data-team="check">업무 체크</button><button data-team="tags">태그 관리</button></div>
      <button data-view="revenue">월간 매출표</button>
    </nav>
    <div class="sidefoot"><button type="button" id="navEdit" class="nav-edit" aria-pressed="false">메뉴 순서 편집</button><a id="sheetLink" target="_blank" rel="noopener">시트 열기 ↗</a></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="datestrip" id="datestrip"></div>
      <div class="actions">
        <button id="btnCarry" title="직전 근무일의 이어갈 항목을 이 날짜로 복사"><i data-icon="carry"></i>전일 가져오기</button>
        <span class="act-sep" aria-hidden="true"></span>
        <button id="btnDoneSort" class="icon-btn" title="완료한 업무를 목록 아래로" aria-label="완료 업무 아래로 정렬" aria-pressed="true"><i data-icon="sinkdone"></i></button>
        <button id="btnCollapse" class="icon-btn" title="완료한 업무 접기" aria-label="완료 업무 접기" aria-pressed="false"><i data-icon="hide"></i></button>
        <button id="btnPrint" class="icon-btn" title="인쇄 (Ctrl+P)" aria-label="인쇄"><i data-icon="print"></i></button>
        <button id="btnReload" class="icon-btn" title="새로고침" aria-label="새로고침"><i data-icon="reload"></i></button>
        <button id="btnTrash" class="icon-btn" title="휴지통 (14일 보관)" aria-label="휴지통"><i data-icon="trash"></i></button>
        <button id="btnKeys" class="icon-btn" title="단축키 (?)" aria-label="단축키 보기">?</button>
      </div>
    </header>

    <section id="viewDaily" class="view hidden">
      <div class="people mobile-only" id="peopleM"></div>
      <div class="seg mobile-only">
        <button data-pane="report" class="active">보고서</button>
        <button data-pane="timeline">타임라인</button>
      </div>
      <div class="daily">
        <div class="report-col">
          <section class="sharedcal" id="sharedcal"></section>
          <section class="sec" id="sharedtasks"></section>
          <article class="report" id="report"></article>
        </div>
        <aside class="timeline" id="timeline"></aside>
      </div>
    </section>

    <section id="viewCalendar" class="view">
      <nav class="content-mobile-nav mobile-only" aria-label="콘텐츠 스튜디오 메뉴">
        <button data-content-view="cal" class="active" aria-pressed="true">캘린더</button>
        <button data-content-view="ana" aria-pressed="false" disabled>분석</button>
        <button data-content-view="plan" aria-pressed="false" disabled>영상 기획</button>
      </nav><div id="contentHub"></div></section>
    <section id="viewDirector" class="view hidden"><div id="directorHub" class="dir"></div></section>
    <section id="viewHome" class="view hidden"><div id="homeHub" class="home"></div></section>
    <section id="viewTeam" class="view hidden"><div id="teamHub" class="team"></div></section>
    <section id="viewRevenue" class="view hidden"><div id="revenueHub"></div></section>
  </main>

  <nav class="bottomnav mobile-only">
    <button data-view="home">홈</button>
    <button data-view="calendar">콘텐츠</button>
    <button data-view="daily" aria-label="일간보고서">보고서</button>
    <button data-view="director" aria-label="원장님 숙제">원장님<span class="nav-badge hidden"></span></button>
    <button data-view="revenue" aria-label="월간 매출표">매출</button>
  </nav>
</div>

<div id="blockEditor" class="popover hidden">
  <input id="beTitle" placeholder="무슨 일?">
  <div class="be-times"><input id="beStart" type="time" step="1800"> ~ <input id="beEnd" type="time" step="1800"></div>
  <div class="be-actions"><button id="beDelete" class="danger">삭제</button><button id="beCancel">취소</button><button id="beSave" class="primary">저장</button></div>
</div>
<div id="appToast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="content-hub.js"></script>
<script src="revenue-model.js"></script>
<script src="revenue-hub.js"></script>
<script src="app.js"></script>
</body>
</html>
